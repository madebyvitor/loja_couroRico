# netlify.toml — Couro Rico

[build]
  command   = "npm run build"
  publish   = "dist"

# ── SPA Routing ───────────────────────────────────────────────────────────────
# Redireciona qualquer rota desconhecida para o index.html com status 200,
# evitando erro 404 ao recarregar páginas como /admin-panel.

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers de segurança e performance ───────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Assets gerados pelo Vite têm hash no nome — podem ser cacheados agressivamente
    Cache-Control = "public, max-age=31536000, immutable"
